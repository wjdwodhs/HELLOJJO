<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 도구 게시판 | HELLOJJO</title>
  <style>
    :root {
      --bg-grad-1: #fff1f2;
      --bg-grad-2: #eef2ff;
      --bg-grad-3: #ecfeff;
      --bg-card: #ffffff;
      --text-main: #1e1b4b;
      --text-sub: #64748b;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --row-hover: #fdf4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100vh;
      padding: 44px 20px;
      color: var(--text-main);
      background:
        radial-gradient(circle at 12% 10%, var(--bg-grad-1) 0%, transparent 45%),
        radial-gradient(circle at 88% 15%, var(--bg-grad-2) 0%, transparent 48%),
        radial-gradient(circle at 50% 95%, var(--bg-grad-3) 0%, transparent 50%),
        #f8fafc;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 22px;
      background: linear-gradient(120deg, #ffffff 0%, #f5f3ff 55%, #fff1f2 100%);
      border: 1.5px solid #e0e7ff;
      border-radius: 24px;
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 14px 34px -14px rgba(99, 102, 241, 0.22);
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(244, 63, 94, 0.12));
      pointer-events: none;
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
      width: 86px;
      height: 86px;
      border-radius: 24px;
      padding: 3px;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6, #06b6d4);
      box-shadow: 0 8px 20px -6px rgba(139, 92, 246, 0.45);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 21px;
      background: #ffffff;
      display: block;
    }

    .hero-info {
      position: relative;
      z-index: 1;
    }

    .repo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
      box-shadow: 0 4px 12px -4px rgba(236, 72, 153, 0.45);
    }

    .hero-info h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(90deg, #1e1b4b 0%, #4f46e5 65%, #e11d48 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .hero-info p {
      font-size: 0.93rem;
      color: var(--text-sub);
    }

    .board-card {
      background: var(--bg-card);
      border: 1.5px solid #e2e8f0;
      border-radius: 22px;
      box-shadow: 0 16px 36px -16px rgba(30, 27, 75, 0.12);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: linear-gradient(90deg, #eef2ff 0%, #fdf2f8 50%, #ecfdf5 100%);
      color: #4338ca;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 14px 18px;
      border-bottom: 1.5px solid #e0e7ff;
      text-align: left;
    }

    thead th.center {
      text-align: center;
    }

    tbody tr {
      transition: background-color 0.2s ease;
    }

    tbody tr:not(:last-child) td {
      border-bottom: 1px solid #f1f5f9;
    }

    tbody tr:hover {
      background-color: var(--row-hover);
    }

    tbody td {
      padding: 18px;
      vertical-align: middle;
    }

    .num {
      width: 68px;
      text-align: center;
    }

    .num-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .num-1 { background: #e0e7ff; color: #4338ca; }
    .num-2 { background: #ffe4e6; color: #be123c; }
    .num-3 { background: #d1fae5; color: #047857; }
    .num-4 { background: #fef3c7; color: #b45309; }
    .num-5 { background: #f3e8ff; color: #7e22ce; }

    .row-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .item-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
      transition: color 0.18s ease;
    }

    tbody tr:hover .item-title {
      color: var(--primary-dark);
    }

    .item-desc {
      font-size: 0.86rem;
      color: var(--text-sub);
    }

    .category-cell {
      width: 112px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-web {
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      color: #ffffff;
      box-shadow: 0 4px 10px -3px rgba(79, 70, 229, 0.45);
    }

    .badge-img {
      background: linear-gradient(135deg, #fb7185, #f97316);
      color: #ffffff;
      box-shadow: 0 4px 10px -3px rgba(244, 63, 94, 0.45);
    }

    .badge-doc {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #ffffff;
      box-shadow: 0 4px 10px -3px rgba(16, 185, 129, 0.45);
    }

    .badge-split {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      color: #ffffff;
      box-shadow: 0 4px 10px -3px rgba(245, 158, 11, 0.45);
    }

    .badge-game {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: #ffffff;
      box-shadow: 0 4px 10px -3px rgba(139, 92, 246, 0.45);
    }

    .path-cell {
      width: 175px;
      text-align: right;
    }

    .path-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4f46e5;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
