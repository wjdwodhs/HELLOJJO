<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 도구 게시판 | HELLOJJO</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 40px 16px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .board {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.04);
    }

    .board-head {
      display: grid;
      grid-template-columns: 64px 1fr 110px 110px;
      gap: 12px;
      padding: 12px 18px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
    }

    .board-head .center {
      text-align: center;
    }

    .post-list {
      list-style: none;
    }

    .post-row {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s ease;
    }

    .post-row:last-child {
      border-bottom: none;
    }

    .post-row:hover {
      background-color: #f8fafc;
    }

    .post-link {
      display: grid;
      grid-template-columns: 64px 1fr 110px 110px;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      text-decoration: none;
      color: inherit;
    }

    .col-no {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 6px;
      padding: 4px 0;
      width: 36px;
      margin: 0 auto;
    }

    .col-title {
      min-width: 0;
    }

    .post-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .post-desc {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .col-tag {
      text-align: center;
    }

    .tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      background: #f1f5f9;
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .col-path {
      text-align: right;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      word-break: break-all;
    }

    @media (max-width: 600px) {
      .board-head {
        display: none;
      }

      .post-link {
        grid-template-columns: 44px 1fr;
        gap: 6px 12px;
        align-items: start;
      }

      .col-no {
        margin-top: 2px;
      }

      .col-tag,
      .col-path {
        grid-column: 2;
        text-align: left;
      }

      .col-tag {
        margin-top: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>웹 도구 게시판</h1>
      <p>저장소에 등록된 페이지, 이미지, 문서를 목록으로 모아둔 게시판입니다.</p>
    </header>

    <main class="board">
      <div class="board-head">
        <span class="center">번호</span>
        <span>제목</span>
        <span class="center">구분</span>
        <span style="text-align: right;">경로</span>
      </div>

      <ul class="post-list" id="post-list">
        <!-- 새 항목을 추가하려면 아래 li 블록을 복사해 순서를 맞추세요 -->
        <li class="post-row">
          <a class="post-link" href="./qr/">
            <span class="col-no">1</span>
            <div class="col-title">
              <div class="post-title">QR 코드 생성기 &amp; 리더기</div>
              <div class="post-desc">링크 입력 시 QR 자동 생성 및 이미지 업로드로 링크 추출</div>
            </div>
            <span class="col-tag"><span class="tag">웹앱</span></span>
            <span class="col-path">./qr/ →</span>
          </a>
        </li>

        <li class="post-row">
          <a class="post-link" href="./123.png">
            <span class="col-no">2</span>
            <div class="col-title">
              <div class="post-title">123.png 이미지 파일</div>
              <div class="post-desc">저장소에 업로드된 PNG 이미지 확인</div>
            </div>
            <span class="col-tag"><span class="tag">이미지</span></span>
            <span class="col-path">./123.png →</span>
          </a>
        </li>

        <li class="post-row">
          <a class="post-link" href="./README.md">
            <span class="col-no">3</span>
            <div class="col-title">
              <div class="post-title">README.md 안내 문서</div>
              <div class="post-desc">저장소 기본 설명 문서 보기</div>
            </div>
            <span class="col-tag"><span class="tag">문서</span></span>
            <span class="col-path">./README.md →</span>
          </a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
