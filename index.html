<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹 도구 게시판 | HELLOJJO</title>
  <style>
    :root {
      --bg-page: #f5f7fb;
      --bg-card: #ffffff;
      --bg-hover: #f8faff;
      --text-main: #111827;
      --text-sub: #6b7280;
      --border-light: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --badge-web-bg: #dbeafe;
      --badge-web-text: #1d4ed8;
      --badge-img-bg: #dcfce7;
      --badge-img-text: #15803d;
      --badge-doc-bg: #f3e8ff;
      --badge-doc-text: #7e22ce;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: radial-gradient(circle at top right, #eef4ff 0%, var(--bg-page) 55%);
      color: var(--text-main);
      line-height: 1.5;
      padding: 48px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .board-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      box-shadow: 0 10px 30px -12px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      background: #fafbfd;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
    }

    thead th.center {
      text-align: center;
    }

    tbody tr {
      transition: background-color 0.18s ease, transform 0.18s ease;
    }

    tbody tr:not(:last-child) td {
      border-bottom: 1px solid #f1f5f9;
    }

    tbody tr:hover {
      background-color: var(--bg-hover);
    }

    tbody td {
      padding: 18px;
      vertical-align: middle;
    }

    .num {
      width: 68px;
      text-align: center;
      font-weight: 600;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .row-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .item-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      transition: color 0.18s ease;
    }

    tbody tr:hover .item-title {
      color: var(--accent);
    }

    .item-desc {
      font-size: 0.86rem;
      color: var(--text-sub);
    }

    .category-cell {
      width: 110px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-web {
      background: var(--badge-web-bg);
      color: var(--badge-web-text);
    }

    .badge-img {
      background: var(--badge-img-bg);
      color: var(--badge-img-text);
    }

    .badge-doc {
      background: var(--badge-doc-bg);
      color: var(--badge-doc-text);
    }

    .path-cell {
      width: 170px;
      text-align: right;
    }

    .path-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: var(--text-sub);
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 5px 10px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .path-link:hover {
      color: var(--accent);
      border-color: #bfdbfe;
      background: var(--accent-soft);
    }

    @media (max-width: 640px) {
      body {
        padding: 28px 14px;
      }

      thead {
        display: none;
      }

      tbody tr {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 8px 12px;
        padding: 16px;
        border-bottom: 1px solid #f1f5f9;
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody td {
        padding: 0;
        border: none !important;
      }

      .num {
        width: auto;
        text-align: left;
        padding-top: 2px;
      }

      .title-cell {
        grid-column: 2 / 4;
      }

      .category-cell {
        grid-column: 2;
        text-align: left;
        width: auto;
      }

      .path-cell {
        grid-column: 3;
        width: auto;
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>웹 도구 게시판</h1>
      <p>저장소에 등록된 페이지, 이미지, 문서를 목록으로 모아둔 게시판입니다.</p>
    </header>

    <section class="board-card">
      <table>
        <thead>
          <tr>
            <th class="center">번호</th>
            <th>제목</th>
            <th class="center">구분</th>
            <th style="text-align: right;">경로</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="num">1</td>
            <td>
              <a class="row-link" href="./qr/">
                <div class="item-title">QR 코드 생성기 &amp; 리더기</div>
                <div class="item-desc">링크 입력 시 QR 자동 생성 및 이미지 업로드로 링크 추출</div>
              </a>
            </td>
            <td class="category-cell">
              <span class="badge badge-web">웹앱</span>
            </td>
            <td class="path-cell">
              <a class="path-link" href="./qr/">./qr/ →</a>
            </td>
          </tr>
          <tr>
            <td class="num">2</td>
            <td>
              <a class="row-link" href="./123.png">
                <div class="item-title">123.png 이미지 파일</div>
                <div class="item-desc">저장소에 업로드된 PNG 이미지 확인</div>
              </a>
            </td>
            <td class="category-cell">
              <span class="badge badge-img">이미지</span>
            </td>
            <td class="path-cell">
              <a class="path-link" href="./123.png">./123.png →</a>
            </td>
          </tr>
          <tr>
            <td class="num">3</td>
            <td>
              <a class="row-link" href="./README.md">
                <div class="item-title">README.md 안내 문서</div>
                <div class="item-desc">저장소 기본 설명 문서 보기</div>
              </a>
            </td>
            <td class="category-cell">
              <span class="badge badge-doc">문서</span>
            </td>
            <td class="path-cell">
              <a class="path-link" href="./README.md">./README.md →</a>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
